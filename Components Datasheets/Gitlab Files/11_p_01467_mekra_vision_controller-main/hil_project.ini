[FOLDERS]
# folder locations are relative to project base folder 
# (which should be the folder where this hil_project.ini is located)

# python script folders
test_pool  = Python/TestPool
test_libs  = Python/TestLibraries

# test results/reports
test_reports = TestReports
test_results = TestReports/SingleTestResults

# test structure data
test_series    = TestStructure
test_sequences = TestStructure/TestSequences

# number of sub-folder levels below test pool to show in EditSequences 
# range 0..12
test_pool_depth  = 5

[RESULTS]
test_result_save_name        = SingleTest.xml
manual_test_result_save_name = SingleTestManual.xml

# Result data storage structure 
# container or classic
storage_structure = container


[TestToolkit]
locale = en

[ENVIRONMENT]
# CUSTOM_ENV_VAR = this is a custom environment variable (overridden in project settings)
# PYTHONHOME = C:\Program Files\Python312
# PYTHONPATH = C:\Program Files\Python312;C:\Program Files\Python312\lib;C:\Tools\Python312_x64\DLLs;
# PATH       = C:\Program Files\Python312;C:\Windows\System32


[INTERPRETER]
# executable = C:\Program Files\Python312\python.exe
# executable = C:\Tools\py38_venv\Scripts\python.exe

